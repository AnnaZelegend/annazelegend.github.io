<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anna's Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e2dfd8; --accent:#1f7a4d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1f1f1f; --ink:#f2f2f2; --muted:#a3a3a3; --line:#333; --accent:#3fae74; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 Inter, -apple-system, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:72px 16px 64px; }
  h1 { font-size:clamp(32px, 6vw, 44px); letter-spacing:-0.03em; margin:0 0 8px; }
  .sub { color:var(--muted); margin:0 0 36px; }
  .list { display:grid; gap:12px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line);
           border-radius:14px; padding:18px 20px; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .card h2 { margin:0; font-size:18px; letter-spacing:-0.01em; display:flex; justify-content:space-between; gap:12px; }
  .card h2 span { color:var(--accent); }
  .card p { margin:4px 0 0; color:var(--muted); font-size:15px; }
  .card small { display:block; margin-top:8px; color:var(--muted); font:12px ui-monospace, Menlo, monospace; }
  footer { margin-top:48px; color:var(--muted); font-size:14px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Anna's Projects</h1>
  <p class="sub">Everything I've put on the web.</p>
  <div class="list" id="list"></div>
  <footer><a href="https://github.com/AnnaZelegend">All code on GitHub</a></footer>
</main>
<script>
  const USER = 'AnnaZelegend';
  const HOME = USER.toLowerCase() + '.github.io';
  // Shown if the GitHub API can't be reached.
  const FALLBACK = ['mp3-converter', 'personal-website', 'house-cost-predictor', 'vandb']
    .map(name => ({ name, description: '', updated: '' }));

  const pretty = s => s.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  function render(sites) {
    const list = document.getElementById('list');
    list.innerHTML = '';
    for (const s of sites) {
      const url = `https://${HOME}/${s.name}/`;
      const a = document.createElement('a');
      a.className = 'card'; a.href = url;
      const h = document.createElement('h2');
      h.textContent = pretty(s.name);
      const arrow = document.createElement('span'); arrow.textContent = '→'; h.append(arrow);
      a.append(h);
      if (s.description) { const p = document.createElement('p'); p.textContent = s.description; a.append(p); }
      const u = document.createElement('small'); u.textContent = url.replace('https://', ''); a.append(u);
      list.append(a);
    }
  }

  render(FALLBACK);
  fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(repos => {
      const sites = repos.filter(r => r.has_pages && r.name.toLowerCase() !== HOME)
        .map(r => ({ name: r.name, description: r.description || '' }));
      if (sites.length) render(sites);
    })
    .catch(() => {});
</script>
</body>
</html>
